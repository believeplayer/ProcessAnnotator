# Extra Windows / Microsoft processes
rules:
  - id: userowa
    priority: 100
    match: { name_equals: "UserOOBEBroker.exe" }
    annotation: "User OOBE Broker — первоначальная настройка Windows"
    annotation_en: "User OOBE Broker"
    category: system

  - id: oobesettings
    priority: 100
    match: { name_equals: "Windows10xOOBE.exe" }
    annotation: "Windows OOBE"
    annotation_en: "Windows OOBE"
    category: system

  - id: consent
    priority: 120
    match: { name_equals: "consent.exe" }
    annotation: "UAC Consent — запрос контроля учётных записей"
    annotation_en: "UAC Consent UI"
    category: system

  - id: sgrmbroker
    priority: 110
    match: { name_equals: "SgrmBroker.exe" }
    annotation: "System Guard Runtime Monitor Broker"
    annotation_en: "System Guard Runtime Monitor Broker"
    category: system

  - id: securityhealthservice
    priority: 140
    match: { name_equals: "SecurityHealthService.exe" }
    annotation: "Служба безопасности Windows"
    annotation_en: "Windows Security Health Service"
    category: antivirus

  - id: securityhealthhost
    priority: 130
    match: { name_equals: "SecurityHealthHost.exe" }
    annotation: "Хост интерфейса Windows Security"
    annotation_en: "Windows Security UI host"
    category: antivirus

  - id: smartscreen_path
    priority: 140
    match: { name_equals: "smartscreen.exe" }
    annotation: "Windows SmartScreen — проверка репутации файлов и сайтов"
    annotation_en: "Windows SmartScreen"
    category: antivirus

  - id: mpcmdrun
    priority: 130
    match: { name_equals: "MpCmdRun.exe" }
    annotation: "Microsoft Defender — утилита командной строки"
    annotation_en: "Microsoft Defender command-line utility"
    category: antivirus

  - id: nissrv
    priority: 140
    match: { name_equals: "NisSrv.exe" }
    annotation: "Microsoft Defender Network Inspection Service"
    annotation_en: "Microsoft Defender Network Inspection Service"
    category: antivirus

  - id: msseces
