# Browsers, messengers, common internet apps
rules:
  - id: chrome_main
    priority: 130
    match: { name_equals: "chrome.exe" }
    annotation: "Google Chrome (основной или worker). Много процессов — нормальная изоляция вкладок."
    annotation_en: "Google Chrome (main or worker). Many processes = normal tab isolation."
    category: browser_worker

  - id: chrome_type
    priority: 140
    match: { name_equals: "chrome.exe", cmdline_contains: "--type=" }
    annotation: "Chrome worker (renderer / gpu / utility / extension)"
    annotation_en: "Chrome worker (renderer / gpu / utility / extension)"
    category: browser_worker

  - id: msedge_worker
    priority: 140
    match: { name_equals: "msedge.exe", cmdline_contains: "--type=" }
    annotation: "Edge worker (renderer / gpu / utility)"
    annotation_en: "Edge worker (renderer / gpu / utility)"
    category: browser_worker

  - id: brave
    priority: 130
    match: { name_equals: "brave.exe" }
    annotation: "Brave Browser"
    annotation_en: "Brave Browser"
    category: browser_worker

