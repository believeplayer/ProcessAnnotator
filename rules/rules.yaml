# ProcessAnnotator Knowledge Base
# match: если указано несколько условий — все должны совпасть (AND)
# priority: чем выше, тем раньше проверяется
# при равном priority побеждает правило из rules.d/, затем имя файла, затем id

rules:
  # ==================== AMD ====================
  - id: amd_auepmaster
    priority: 200
    match:
      name_equals: "AUEPMaster.exe"
    annotation: "AMD User Experience Program (телеметрия AMD). Собирает данные об использовании."
    annotation_en: "AMD User Experience Program (AMD telemetry). Collects usage data."
    category: telemetry
    severity: info
    actions:
      - "Можно отключить в Radeon Software → Preferences → AMD Privacy"

  - id: amd_auepmaster_path
    priority: 195
    match:
      path_contains: "AMD\\Performance Profile Client"
      name_contains: "AUEP"
    annotation: "AMD User Experience Program (телеметрия)"
    annotation_en: "AMD User Experience Program (telemetry)"
    category: telemetry
    severity: info
    actions:
      - "Можно отключить в Radeon Software"

  - id: amd_radeon_software
    priority: 160
    match:
      name_equals: "RadeonSoftware.exe"
    annotation: "AMD Radeon Software (панель управления графикой)"
    annotation_en: "AMD Radeon Software (graphics control panel)"
    category: vendor
    severity: info

  - id: amd_amdrsserv
    priority: 150
    match:
      name_equals: "AMDRSServ.exe"
    annotation: "AMD Radeon Settings Service"
    annotation_en: "AMD Radeon Settings Service"
